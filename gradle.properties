# Speicher-Deckel: Gradle- und Kotlin-Daemon zusammen < ~2,5 GB statt je 2 GB+.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m
# Daemons nach 30 min Leerlauf beenden (Default: 3 h) und Worker-Prozesse begrenzen.
org.gradle.daemon.idletimeout=1800000
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
